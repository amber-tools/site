<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="A drop of amber with a fern frond preserved whole inside it.">
  <defs>
    <radialGradient id="stone" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity=".95"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="210" cy="152" rx="190" ry="140" fill="url(#glow)"/>

  <!-- the stone -->
  <path d="M210 26
           c58 0 112 40 128 96
           c16 56 -14 118 -68 142
           c-54 24 -122 12 -158 -34
           c-36 -46 -34 -118 8 -158
           c25 -30 56 -46 90 -46z"
        fill="url(#stone)" stroke="#047857" stroke-width="2"/>

  <!-- inner layers, the way resin sets in waves -->
  <path d="M132 70 c46 -30 108 -26 150 12" fill="none" stroke="#ecfdf5" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 118 c56 -44 142 -44 206 6" fill="none" stroke="#ecfdf5" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 196 c64 40 150 36 214 -14" fill="none" stroke="#064e3b" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>

  <!-- the inclusion: a fern frond, every leaflet still in place -->
  <g stroke="#06342a" stroke-linecap="round" fill="none">
    <path d="M196 196 C204 174 210 150 214 112" stroke-width="3"/>
    <g stroke-width="2.2" stroke-opacity=".92">
      <path d="M199 186 C188 182 180 174 176 164"/>
      <path d="M201 176 C190 171 183 163 179 153"/>
      <path d="M204 164 C193 159 186 151 183 141"/>
      <path d="M206 152 C196 147 189 139 186 130"/>
      <path d="M209 140 C200 135 194 127 191 119"/>
      <path d="M211 128 C204 124 199 117 196 110"/>
      <path d="M200 186 C211 182 219 174 223 164"/>
      <path d="M202 176 C213 171 220 163 224 153"/>
      <path d="M205 164 C216 159 223 151 226 141"/>
      <path d="M207 152 C217 147 224 139 227 130"/>
      <path d="M210 140 C219 135 225 127 228 119"/>
      <path d="M212 128 C219 124 224 117 227 110"/>
    </g>
  </g>
  <ellipse cx="204" cy="152" rx="40" ry="56" fill="#ecfdf5" fill-opacity=".10"/>

  <!-- highlight -->
  <ellipse cx="150" cy="82" rx="34" ry="20" fill="#ecfdf5" fill-opacity=".45" transform="rotate(-28 150 82)"/>
</svg>
